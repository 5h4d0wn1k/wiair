[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "wiair"
version = "1.0.0"
description = "Wireless offensive framework — byte-exact 802.11/BLE frame craft+parse, offline-only safety-gated"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "5h4d0wn1k", email = "5h4d0wn1k@users.noreply.github.com"},
]
keywords = ["wireless", "802.11", "ble", "security", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
scapy = ["scapy>=2.5"]
all = ["scapy>=2.5"]
dev = ["scapy>=2.5"]

[project.scripts]
wiair = "wiair.cli:main"

[tool.setuptools.packages.find]
include = ["wiair*"]
